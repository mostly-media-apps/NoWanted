<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>No Wanted</title>
<link rel="stylesheet" href="../ui/ui.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="phone">
  <div class="screen">
    <!-- Wallpaper, the one picture in the interface: sunset while on, night when off. -->
    <div class="wallpaper" aria-hidden="true"><img src="../art/scene.svg" alt=""><img class="night" src="../art/scene-night.svg" alt=""></div>

    <div class="status mono" aria-hidden="true">
      <span id="clock"></span>
      <span class="bars"><i></i><i></i><i></i><i></i></span>
    </div>

    <header class="home-head">
      <div class="title-row">
        <h1 class="name display" aria-label="No Wanted">No<i class="hair"></i>wanted</h1>
        <p class="sub">for <span class="redact">GTA 6</span></p>
      </div>
      <label class="switch" title="Turn No Wanted on or off"><input type="checkbox" id="enabled" aria-label="No Wanted on"><span class="track"><span class="knob"></span></span></label>
    </header>
    <div class="tally">
      <span class="big display" id="total">0</span>
      <span class="tally-words"><span>spoilers blocked</span><span class="mono" id="count" role="status"></span></span>
      <button type="button" class="pick-btn" id="pick-item" title="Hide or show an item on this page" aria-label="Hide or show an item on this page" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
    </div>

    <!-- Quiet tab-local recovery buttons on the sky: hide mode blur fallback, Show this page, and stale-tab reload -->
    <div class="tab-actions" id="tab-actions" hidden>
      <button type="button" class="tab-action" id="show-blurred" hidden>Show them blurred on this tab</button>
      <button type="button" class="tab-action" id="show-page" hidden>Show this page</button>
      <button type="button" class="tab-action" id="reload-tab" hidden>Reload this tab</button>
    </div>

    <!-- Shown only on Safari when the active tab has no address and all-sites access is not granted yet -->
    <div class="access-note" id="access-note" hidden><p id="access-text"></p></div>

    <!-- Shown once, the first time the menu is opened after the end date switched hiding off -->
    <div class="ended" id="ended" role="status" hidden>
      <p id="ended-text"></p>
      <div class="ended-row"><button type="button" id="ended-on">Switch back on</button><button type="button" class="ended-keep" id="ended-keep">Keep it off</button></div>
    </div>

    <nav class="apps" id="apps" aria-label="Block an account"></nav>

    <div class="dock">
      <button type="button" class="app" data-app="web">
        <span class="tile plain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3Z"/></svg><span class="badge mono" hidden></span></span>
        <span class="label">Websites</span>
      </button>
      <button type="button" class="app" data-app="allow">
        <span class="tile plain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5.5"/></svg><span class="badge mono" hidden></span></span>
        <span class="label">Allowed</span>
      </button>
      <button type="button" class="app" data-app="stats">
        <span class="tile plain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V12M10 20V6M15 20v-9M20 20V3"/></svg></span>
        <span class="label">Stats</span>
      </button>
      <button type="button" class="app" id="settings">
        <span class="tile plain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></span>
        <span class="label">Settings</span>
      </button>
    </div>

    <!-- One app, opened over the home screen -->
    <section class="sheet" id="sheet" aria-labelledby="sheet-name" hidden>
      <div class="sheet-body">
      <button type="button" class="back" id="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Home</button>
      <div class="sheet-head">
        <span class="tile" id="sheet-tile"></span>
        <h2 id="sheet-name"></h2>
      </div>
      <form id="add" class="add">
        <label for="handle" id="handle-label">Block an account</label>
        <div class="entry">
          <span class="prefix mono" id="prefix">@</span>
          <input type="text" id="handle" autocomplete="off" spellcheck="false">
          <button type="submit">Block</button>
        </div>
        <p class="note" id="note"></p>
      </form>
      <ul class="blocked" id="blocked"></ul>
      <p class="empty" id="empty"></p>
      </div>
    </section>
    <section class="sheet stats" id="stats" aria-labelledby="stats-title" hidden>
      <div class="sheet-body">
      <button type="button" class="back" data-back><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Home</button>
      <div class="stats-head">
        <h2 id="stats-title" class="visually-hidden">Stats</h2>
        <span class="big display" id="s-total">0</span>
        <span class="stats-note" id="s-since"></span>
      </div>
      <dl class="trio">
        <div><dt>Today</dt><dd class="display" id="s-today">0</dd></div>
        <div><dt>This week</dt><dd class="display" id="s-week">0</dd></div>
        <div><dt>This page</dt><dd class="display" id="s-page">0</dd></div>
      </dl>
      <div class="week" id="s-days" aria-label="The last seven days"></div>
      <div class="split">
        <section><h3>What it caught</h3><ul class="bars-list" id="s-kinds"></ul></section>
        <section><h3>Where</h3><ul class="bars-list" id="s-sites"></ul></section>
      </div>
      </div>
    </section>
    <p class="save-note" id="save-note" role="alert" hidden></p>
  </div>
</div>

<script src="../src/terms.js"></script>
<script type="module" src="popup.js"></script>
</body>
</html>
